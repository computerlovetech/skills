# .github/workflows/publish.yml
# Tag-driven release: push a vX.Y.Z tag -> quality -> build (+verify version
# matches tag) -> publish to PyPI via trusted publishing (OIDC) -> create a
# GitHub Release with notes extracted from CHANGELOG.md.
#
# Replace <tool> with the PyPI project name.
#
# One-time PyPI setup (no API token needed): on PyPI, project Settings ->
# Publishing -> add this repo + this workflow filename + environment name "pypi".
# For a brand-new project name, use PyPI's "pending publisher" flow so the first
# release can create the project.

name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build but do not publish)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write  # required for trusted publishing (OIDC)

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest -m "not e2e and not network and not slow"

  build:
    name: Build Package
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - name: Build package
        run: uv build
      - name: Verify package version matches tag
        if: github.event_name == 'push'
        run: |
          PKG_VERSION=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: pyproject.toml has $PKG_VERSION but tag is $TAG_VERSION"
            exit 1
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || !inputs.dry_run
    environment:
      name: pypi
      url: https://pypi.org/project/<tool>/
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted publishing (OIDC) — no API token configured anywhere.

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || !inputs.dry_run
    permissions:
      contents: write  # only this job needs write access
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Validate tag format
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([ab][0-9]+)?$ ]]; then
            echo "Error: Invalid tag format '$TAG_NAME'"
            echo "Expected: vX.Y.Z or vX.Y.Za1/vX.Y.Zb1 (e.g. v0.6.5, v0.7.1b1)"
            exit 1
          fi
      - name: Extract release notes from CHANGELOG
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "Error: CHANGELOG.md not found"
            exit 1
          fi
          VERSION_NUM="${TAG_NAME#v}"
          # Extract the section for this version: from [X.Y.Z] until the next [..]
          NOTES=$(awk -v ver="$VERSION_NUM" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") found=1
              next
            }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "Error: Version $VERSION_NUM not found in CHANGELOG.md"
            echo "Expected a heading like: ## [$VERSION_NUM] - YYYY-MM-DD"
            exit 1
          fi
          {
            echo "## What's New in $TAG_NAME"
            echo ""
            echo "$NOTES"
            echo ""
            echo "---"
            echo ""
            echo "**Full changelog**: ${{ github.server_url }}/${{ github.repository }}/blob/main/CHANGELOG.md"
          } > "${RUNNER_TEMP}/release_notes.md"
          cat "${RUNNER_TEMP}/release_notes.md"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "::warning::Release $TAG_NAME already exists, skipping creation"
          else
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes-file "${RUNNER_TEMP}/release_notes.md"
          fi
