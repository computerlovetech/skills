# Template pyproject.toml for a uv-managed Typer CLI.
# Replace <tool> / <package> placeholders. <tool> is the command users type
# (e.g. "agr", "oe"); <package> is the importable module name (e.g. "agr",
# "outcome_engineering").

[project]
name = "<tool>"                       # PyPI distribution name (must be unique on PyPI)
version = "0.1.0"                     # SINGLE SOURCE OF TRUTH for the version
description = "<one-line description>"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer>=0.16",                   # the CLI framework
    "rich>=13.0",                    # optional: nicer terminal output
]

[project.scripts]
<tool> = "<package>.cli:app"         # makes `<tool>` runnable; points at the Typer app

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "ty>=0.0.14",
    # "mkdocs-material>=9.0",        # uncomment if you build docs
]

# Pick ONE build backend. hatchling and uv_build both work.

# Option A — hatchling
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["<package>"]

# Option B — uv_build (delete Option A above if you use this)
# [build-system]
# requires = ["uv_build>=0.8.0,<0.9.0"]
# build-backend = "uv_build"

# Mark slow / network / e2e tests so CI can exclude them.
[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests requiring network",
    "network: tests that make real network requests",
    "slow: tests taking > 5 seconds",
]
